<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function calc(){
            let sum=0
            for(let i=0; i<arguments.length; i++){
                sum+=arguments[i];
            }
            return sum;
            //return x+y;
        }
        let res2=calc(10,20,30,40,50);
        document.write(res2); // 150
        console.log(res2); // 150     
        let res=calc(10,20);
        console.log(res); // 30
        document.write(res); // 30
    </script>
</body>
</html>
